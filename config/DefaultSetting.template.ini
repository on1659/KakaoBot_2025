# KakaoBot UI가 처음 실행될 때 사용할 수 있는 설정 템플릿입니다.
# 실제 채팅방 이름, API 키, 개인 서버 경로는 이 파일에 넣지 마세요.

[BotName]
name = 카카오봇

[RoomList]
# UI에서 채팅방을 추가하세요.

[APIKey]
path = config/api_key.json

[ChattingRoomSetting]
path = config/chatrooms.json

[EveryMentionDefaultDelayTime]
value = 0.005

[GPT]
maxToken = 1000
defaultModel = gpt-5-nano
answerLengthLimit = 답변은 500자 이내로 정리해줘

[GPT_MODEL]
gpt-4o-mini / 80
gpt-5-nano / 70
gpt-5-mini / 90
gpt-5 / 120

[RADAR]
baseUrl = https://awhirl-preimpressive-carina.ngrok-free.dev
apiKeyEnv = GAME_WIKI_API_KEY

[GitHub]
autoUpdate = true
branch = main

[FeatherMonitor]
enabled = false
notification_room =
log_filename = latest.log
server_names =
server_paths =
